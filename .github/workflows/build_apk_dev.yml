name: Build Cordova Android APK (Debug)

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: "main"
          fetch-depth: 0 # fetch full history for checking commits in submodule

      - name: Copy required files
        run: |
          git submodule add -f -b gh-pages https://github.com/hkbus/hk-independent-bus-eta/ www 
          cp -R assets/additionals/ www/
          sed -i 's/id="hk.spooky.hkbusapp"/id="hk.spooky.hkbusapp.dev"/' config.xml
          sed -i 's|<name>HKBus</name>|<name>HKBus (Dev)</name>|' config.xml

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install required packages
        run: |
          pnpm install
          pnpm exec cordova platform add android

      - name: Build APK
        run: pnpm exec cordova build android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKBus-Cordova-Dev-DebugSigned.apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
